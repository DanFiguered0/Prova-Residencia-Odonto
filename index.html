<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Residência CTBMF — HEAT/SES/RJ 2027</title><link rel="stylesheet" href="style.css"></head><body><header><h1>RESIDÊNCIA CTBMF — HEAT/SES/RJ 2027</h1><p>Banco de 600 questões comentadas • Preparação independente, não oficial</p></header><main><section class="panel"><div id="notice" role="status"></div><div id="stats"></div><nav aria-label="Modos e ações"><button id="study">Modo estudo</button><button id="exam">Prova de 30 questões</button><button id="finish">Finalizar prova</button><button id="review">Refazer erros</button><button id="export">Exportar progresso</button><label class="upload">Importar progresso <input type="file" id="import" accept="application/json,.json"></label><button id="reset">Nova tentativa</button></nav><div class="filters"><label>Área <select id="topic"><option value="">Todas</option></select></label><label>Dificuldade <select id="difficulty"><option value="">Todas</option><option>Intermediária</option><option>Difícil</option><option>Muito difícil</option></select></label><label>Situação <select id="status"><option value="">Todas</option><option value="pending">Pendentes</option><option value="correct">Corretas</option><option value="wrong">Incorretas</option><option value="marked">Marcadas</option></select></label></div><div class="filters"><label>Tempo da prova <select id="duration"><option value="180">3 horas</option><option value="120">2 horas</option><option value="60">1 hora</option><option value="0">Sem limite</option></select></label><span id="timer" aria-live="off"></span></div></section><section class="panel"><div id="question"></div><div class="pager"><button id="prev">Anterior</button><span id="position"></span><button id="next">Próxima</button></div><details><summary>Ir para uma questão</summary><div id="numbers"></div></details></section><section class="panel"><h2>Meu desempenho</h2><div id="performance"></div><h2>Histórico de tentativas</h2><div id="history"></div></section><footer>Progresso salvo neste navegador. Exporte um backup JSON periodicamente: a limpeza dos dados do navegador pode apagá-lo.</footer></main><script src="questions.js"></script><script src="script.js"></script></body></html>
